name: CI
on:
  push:
    branches: [develop, main, 'issue-*', 'release/**', 'release-main/**', 'chore/publication-cleanup']
  pull_request:
    branches: [develop, main, 'issue-*']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.7', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ci.txt
      - run: bash scripts/verify.sh

