name: Claude Conflict Resolve
on:
  workflow_run:
    workflows: [CI]
    types: [requested]
    branches: [develop]
  pull_request:
    types: [opened, reopened]
    branches: [develop]
  workflow_dispatch:
    inputs:
      issue_number:
        required: false
        type: string

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          source="$(jq -r --arg repo "$GH_REPO" '.pull_request.head.repo.full_name // .workflow_run.head_repository.full_name // $repo' "$GITHUB_EVENT_PATH")"
          if [ "$source" != "$GH_REPO" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "External pull request: privileged automation skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Shared detection scans all issue branches; stop if a fork could be selected.
          foreign="$(gh pr list --repo "$GH_REPO" --base develop --state open --limit 1000 --json isCrossRepository,headRefName --jq '[.[] | select(.isCrossRepository and (.headRefName | test("^issue-[0-9]+$")))] | length')"
          if [ "$foreign" != 0 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "External issue branch exists: automatic conflict resolution skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          permission="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)"
          allowed=false
          case "$permission" in admin|maintain|write) allowed=true ;; esac
          case "$ACTOR" in 'issue-deck[bot]'|'github-actions[bot]') allowed=true ;; esac
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then
            echo "Actor has no verified write access: automation skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
  conflict-resolve:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-conflict-resolve.yml@workflows/v53
    with:
      runtime-setup: minimal
      package-manager: npm
      prompts-ref: workflows/v53
      install-dependencies: false
      verify-commands: 'python3 -m pip install -r requirements-ci.txt を実行後、bash scripts/verify.sh でハードウェアなし検証を行う。ARMv6実機検証は別途記録し、未実施を成功扱いにしない。'
      issue-number: ${{ inputs.issue_number }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
