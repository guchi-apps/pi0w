<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROOM Panel</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#2fbf8f">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ROOM Panel">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='lcd.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='led.css') }}">
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-row">
      <h1>ROOM Panel</h1>
      <form method="post" action="{{ url_for('power.set_all_off', value='on' if snapshot.all_off else 'off') }}">
        <button type="submit" class="all-off-btn{% if snapshot.all_off %} is-active{% endif %}">
          {% if snapshot.all_off %}OFFを解除{% else %}LCD/LED 全OFF{% endif %}
        </button>
      </form>
    </div>
  </header>

  <main>
  {% include "_lcd_section.html" %}
  {% include "_led_section.html" %}
  {% include "_status_section.html" %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
