name: Claude Code / Codex Review (develop向けPR)
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          source="$(jq -r --arg repo "$GH_REPO" '.pull_request.head.repo.full_name // .workflow_run.head_repository.full_name // $repo' "$GITHUB_EVENT_PATH")"
          if [ "$source" != "$GH_REPO" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "External pull request: privileged automation skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          permission="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)"
          allowed=false
          case "$permission" in admin|maintain|write) allowed=true ;; esac
          case "$ACTOR" in 'issue-deck[bot]'|'github-actions[bot]') allowed=true ;; esac
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then
            echo "Actor has no verified write access: automation skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
  review:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-review-develop.yml@workflows/v52
    with:
      prompts-ref: workflows/v52
      enable-auto-merge: true
      dependency-check: any
      risk-paths: |
        (^|/)requirements.*\.txt$ :: Python依存変更にはARMv6/Python 3.7の実機互換性確認が必要
        (^|/)(install|deploy)\.sh$ :: 実機配置・サービス操作への影響を確認する
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
